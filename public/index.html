<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pay Now Malawi</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Arial', sans-serif; background: #f5f5f5; padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 30px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #1a1a2e; }
        .logo { text-align: center; font-size: 48px; margin-bottom: 20px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input { width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 16px; }
        .btn { width: 100%; padding: 14px; background: #e94560; color: white; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; }
        .btn:hover { background: #c73652; }
        .result { margin-top: 20px; padding: 15px; border-radius: 8px; display: none; }
        .result.success { background: #d4edda; color: #155724; display: block; }
        .result.error { background: #f8d7da; color: #721c24; display: block; }
        .footer { text-align: center; margin-top: 20px; color: #999; font-size: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">💳</div>
        <h1>Pay Now Malawi</h1>
        <p style="text-align: center; margin-bottom: 30px; color: #666;">Pay with Airtel Money</p>

        <div class="form-group">
            <label>📱 Phone Number</label>
            <input type="tel" id="phone" placeholder="e.g., 0888XXXXXX" />
        </div>

        <div class="form-group">
            <label>💰 Amount (MWK)</label>
            <input type="number" id="amount" placeholder="e.g., 5000" />
        </div>

        <button class="btn" onclick="makePayment()">💸 Pay Now</button>
        <div class="result" id="result"></div>
        <div class="footer">🇲🇼 Built for Malawi • Powered by Airtel Money</div>
    </div>

    <script>
        const API_URL = window.location.origin; // Uses same domain as frontend

        async function makePayment() {
            const phone = document.getElementById('phone').value;
            const amount = document.getElementById('amount').value;
            const resultDiv = document.getElementById('result');

            if (!phone || !amount) {
                resultDiv.className = 'result error';
                resultDiv.textContent = '❌ Please fill in all fields';
                return;
            }

            try {
                const response = await fetch(`${API_URL}/api/payment`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phoneNumber: phone, amount })
                });

                const data = await response.json();

                if (data.success) {
                    resultDiv.className = 'result success';
                    resultDiv.textContent = `✅ ${data.message}\nTransaction ID: ${data.transactionId}`;
                } else {
                    resultDiv.className = 'result error';
                    resultDiv.textContent = `❌ ${data.error}`;
                }
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.textContent = '❌ Network error. Please try again.';
            }
        }
    </script>
</body>
</html>
